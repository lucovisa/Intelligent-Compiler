[workspace]
members = [
    "crates/ic-core",
    "crates/ic-render",
    "crates/ic-lua",
    "crates/ic-build",
    "crates/ic-gui",
    "crates/ic-cli",
    "crates/ic-runtime",
]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.1.0"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
