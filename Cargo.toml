[workspace]
resolver = "2"
members = ["crates/ic-core", "crates/ic-render", "crates/ic-lua", "crates/ic-build", "crates/ic-cli", "crates/ic-studio"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[profile.dev]
opt-level = 1

# зависимости (wgpu, winit) в debug тоже быстрые
[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
