name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Linux libs
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libgl1-mesa-dev libx11-dev
      - name: Auto-format
        if: github.event_name == 'push' && github.ref_type == 'branch'
        run: |
          cargo fmt --all
          if ! git diff --quiet; then
            git config user.name "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
            git commit -am "style: cargo fmt"
            git push
          fi
      - run: cargo clippy --workspace --all-targets
      - run: cargo test --workspace

  build:
    needs: check
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
            ext: ".exe"
          - os: ubuntu-latest
            name: linux
            ext: ""
          - os: macos-latest
            name: macos
            ext: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Linux libs
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libgl1-mesa-dev libx11-dev
      - run: cargo build --release --workspace
      - name: Package
        shell: bash
        run: |
          mkdir -p pkg dist
          cp target/release/ic${{ matrix.ext }} pkg/
          mkdir -p pkg/projects/demo
          cp examples/demo/* pkg/projects/demo/
          if [ "$RUNNER_OS" = "Windows" ]; then
            (cd pkg && 7z a ../dist/ic-${{ matrix.name }}.zip .)
          else
            (cd pkg && zip -qr ../dist/ic-${{ matrix.name }}.zip .)
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ic-${{ matrix.name }}
          path: pkg/*
          if-no-files-found: error
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
